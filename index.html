<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strand Associates NEC Conductor, Conduit & Tray Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 950px; margin: 40px auto; background-color: #f4f4f9; color: #333; }
        .container { background: white; padding: 0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        
        .header-container { background-color: #000; padding: 20px 40px; display: flex; align-items: center; border-bottom: 5px solid #B0925A; }
        h1 { font-size: 24px; color: #fff; margin: 0; font-weight: normal; letter-spacing: 0.5px; }
        
        .content-area { padding: 20px 40px 40px 40px; }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ddd; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 15px; cursor: pointer; color: #666; outline: none; transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { color: #000; border-bottom: 3px solid #B0925A; font-weight: bold; }
        .tab-btn:hover:not(.active) { color: #B0925A; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="number"], select { font-size: 16px; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; transition: background-color 0.3s; }
        
        .radio-group { display: flex; gap: 20px; margin-top: 5px; flex-wrap: wrap; }
        .radio-group label { font-weight: normal; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .button-group { display: flex; gap: 15px; margin-top: 20px; }
        button.calc-btn { background-color: #B0925A; color: #000; font-weight: bold; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; transition: background-color 0.2s; }
        button.calc-btn:hover { background-color: #967D4D; }
        button.reset-btn { background-color: #8E908F; color: #fff; font-weight: bold; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; transition: background-color 0.2s; }
        button.reset-btn:hover { background-color: #717372; }
        
        .results { margin-top: 25px; padding: 20px; background-color: #fcfcfc; border-radius: 4px; display: none; border-left: 5px solid #B0925A; border-right: 1px solid #ddd; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; }
        .results-header { font-size: 18px; margin-top: 0; color: #000; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; border-bottom: 2px solid #B0925A; padding-bottom: 5px; display: inline-block; }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .results-column h3 { font-size: 15px; margin-top: 0; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px; color: #333; }
        .results-column p { margin: 6px 0; font-size: 14px; }
        .results-column strong { color: #000; }
        
        .math-box { background: #fff; padding: 15px; border-radius: 4px; border: 1px solid #ccc; margin-top: 20px; font-size: 13px; color: #444; width: 100%; box-sizing: border-box; }
        .math-box summary { font-size: 14px; color: #B0925A; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; outline: none; }
        .math-box summary:hover { text-decoration: underline; }
        .math-box-content { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; line-height: 1.5; overflow-x: auto; }
        
        .strand-format-box { grid-column: 1 / -1; background: #000; padding: 15px; border-radius: 4px; border: 1px solid #000; margin-top: 5px; }
        .strand-format-box h3 { font-size: 14px; color: #B0925A; margin-top: 0; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .strand-format-box p { font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; margin: 0; line-height: 1.6; color: #fff; font-weight: bold; }
        
        .tray-row { display: flex; gap: 10px; align-items: center; }
        .tray-row input { flex: 1; }
        .tray-row select { flex: 2; }

        /* Mobile Responsive Overrides */
        @media (max-width: 768px) {
            body { margin: 0; background-color: #fff; }
            .container { border-radius: 0; box-shadow: none; border: none; }
            .header-container { padding: 15px 20px; }
            h1 { font-size: 20px; }
            .content-area { padding: 15px 20px 30px 20px; }
            
            /* Tab Grid for Mobile */
            .tabs { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 10px; 
                border-bottom: none; 
                margin-bottom: 25px;
                overflow: visible; 
            }
            .tab-btn { 
                border: 1px solid #ddd; 
                border-radius: 6px; 
                padding: 12px 10px; 
                text-align: center; 
                white-space: normal; 
                font-size: 13px; 
                line-height: 1.3;
                background-color: #f9f9f9;
            }
            .tab-btn.active { 
                border: 2px solid #B0925A; 
                background-color: #fff;
            }

            .form-grid { grid-template-columns: 1fr; gap: 12px; }
            .form-grid > div[style*="grid-column: span 2"] { grid-column: span 1 !important; }
            
            .button-group { flex-direction: column; gap: 10px; }
            .button-group button { padding: 15px 20px; }
            
            .results-grid { grid-template-columns: 1fr; gap: 15px; }
            .results { padding: 15px; }
            
            .xfmr-pri { border-right: none !important; padding-right: 0 !important; border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 5px; }
            .xfmr-sec { padding-left: 0 !important; }
            .xfmr-results-flex { flex-direction: column; gap: 20px !important; }
            
            .tray-row { flex-wrap: wrap; }
            .tray-row input[placeholder="Qty"] { flex: 1; min-width: 60px; }
            .tray-row span { display: none; }
            .tray-row select { flex: 3; min-width: 150px; }
            .tray-row input[placeholder="OD (in)"] { flex: 1 1 100%; margin-top: 5px; }
        }

        /* ---------- Conduit Fill Tab ---------- */
        .cf-row { display: flex; gap: 10px; align-items: center; }
        .cf-qtybox { display: flex; flex: 0 0 122px; }
        .cf-qtybox button { width: 36px; border: 1px solid #ccc; background: #f4f4f9; font-size: 18px; font-weight: bold; color: #333; cursor: pointer; padding: 0; }
        .cf-qtybox button:hover { background: #e6e0d0; }
        .cf-qtybox button:first-child { border-radius: 4px 0 0 4px; }
        .cf-qtybox button:last-child { border-radius: 0 4px 4px 0; }
        .cf-qtybox input { text-align: center; border-radius: 0; border-left: 0; border-right: 0; padding: 8px 2px; min-width: 0; -moz-appearance: textfield; }
        .cf-qtybox input::-webkit-outer-spin-button, .cf-qtybox input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .cf-x { font-weight: bold; }
        .cf-row select.cf-size { flex: 1; min-width: 0; }
        .cf-row input.cf-od { flex: 0 0 140px; width: 140px; }
        .cf-remove { background: none; border: 1px solid #ccc; border-radius: 4px; color: #8E908F; font-size: 16px; width: 36px; height: 36px; cursor: pointer; flex: 0 0 36px; padding: 0; }
        .cf-remove:hover { color: #d9534f; border-color: #d9534f; }
        .cf-add-btn { background: none; border: 1px dashed #ccc; padding: 12px; width: 100%; cursor: pointer; color: #666; font-weight: bold; border-radius: 4px; transition: background-color 0.2s; font-size: 14px; }
        .cf-add-btn:hover { background: #f9f9f9; }

        .cf-result-box { padding: 20px; background: #fff; border-radius: 4px; border: 2px solid green; margin-bottom: 15px; }
        .cf-result-box.fail { border-color: #d9534f; }
        .cf-pct-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; font-weight: bold; }
        .cf-pct { font-size: 48px; font-weight: bold; line-height: 1.1; color: green; }
        .cf-pct.fail { color: #d9534f; }
        .cf-status { font-size: 15px; font-weight: bold; margin: 8px 0 0 0; color: green; }
        .cf-status.fail { color: #d9534f; }
        .cf-msg { font-size: 14px; margin: 8px 0 0 0; line-height: 1.5; }
        .cf-bar { position: relative; height: 18px; background: #e9ecef; border-radius: 9px; margin: 16px 0 6px 0; overflow: visible; }
        .cf-bar-fill { height: 100%; border-radius: 9px; background: green; max-width: 100%; }
        .cf-bar-fill.fail { background: #d9534f; }
        .cf-bar-limit { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #000; }
        .cf-bar-legend { font-size: 12px; color: #666; }

        @media (max-width: 768px) {
            .cf-row { flex-wrap: wrap; }
            .cf-row select.cf-size { flex: 1 1 140px; }
            .cf-row input.cf-od { flex: 1 1 100%; width: 100%; }
            .cf-pct { font-size: 40px; }
            .tabs .tab-btn:last-child:nth-child(odd) { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>Strand Associates NEC Wire, Conduit & Tray Sizer</h1>
    </div>
    
    <div class="content-area">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('feeder', this)">Feeder Circuit<br><small>(Breaker)</small></button>
            <button class="tab-btn" onclick="switchTab('motor', this)">Motor Circuit<br><small>(VFD/Starter)</small></button>
            <button class="tab-btn" onclick="switchTab('xfmr', this)">Transformer<br><small>Sizing</small></button>
            <button class="tab-btn" onclick="switchTab('tray', this)">Cable Tray<br><small>Fill Limit</small></button>
            <button class="tab-btn" onclick="switchTab('conduit', this)">Conduit Fill<br><small>Percentage</small></button>
        </div>

        <!-- Feeder Circuit Tab -->
        <div id="feeder" class="tab-content active">
            <div class="form-grid">
                <div>
                    <label>Breaker Size (Standard Amps)</label>
                    <select id="f_amps"></select>
                </div>
                <div>
                    <label>Voltage</label>
                    <select id="f_volt" onchange="autoFillWires('f')">
                        <option value="120">120V</option>
                        <option value="208">208V</option>
                        <option value="240">240V</option>
                        <option value="480" selected>480V</option>
                        <option value="600">600V</option>
                    </select>
                </div>
                <div>
                    <label>Phases</label>
                    <select id="f_phase">
                        <option value="1">1-Phase</option>
                        <option value="3" selected>3-Phase</option>
                    </select>
                </div>
                <div>
                    <label>Total Wires per Conduit</label>
                    <input type="number" id="f_wires" value="4" min="2">
                </div>
                <div>
                    <label>Current-Carrying Conductors</label>
                    <input type="number" id="f_ccc" value="3" min="0">
                </div>
                <div>
                    <label>One-Way Distance (ft)</label>
                    <input type="number" id="f_dist" placeholder="0" min="0" oninput="toggleGray(this)">
                </div>
                <div style="grid-column: span 2;">
                    <label>Actual Load Amps (Optional - required to show Voltage Drop)</label>
                    <input type="number" id="f_load_amps" placeholder="Leave blank to hide voltage drop calculation" min="0" oninput="toggleGray(this)">
                </div>
            </div>
            <div class="button-group">
                <button class="calc-btn" onclick="runFeederCalc()">Calculate Feeder</button>
                <button class="reset-btn" onclick="resetDefaults('feeder')">Reset Defaults</button>
            </div>
            <div id="f_results" class="results"></div>
        </div>

        <!-- Motor Circuit Tab -->
        <div id="motor" class="tab-content">
            <div class="form-grid">
                <div style="grid-column: span 2;">
                    <label>Motor Rating Input Method</label>
                    <div class="radio-group">
                        <label><input type="radio" name="m_input_type" value="hp" checked onchange="toggleMotorInput()"> Standard Horsepower (HP)</label>
                        <label><input type="radio" name="m_input_type" value="amps" onchange="toggleMotorInput()"> Custom Full Load Amps (FLA)</label>
                    </div>
                </div>
                <div>
                    <label>Motor Voltage</label>
                    <select id="m_volt" onchange="populateMotorHPs()">
                        <option value="120">120V (1-Phase)</option>
                        <option value="208">208V (3-Phase)</option>
                        <option value="240">240V (1-Phase)</option>
                        <option value="480" selected>480V (3-Phase)</option>
                    </select>
                </div>
                <div id="div_m_hp">
                    <label>Motor Horsepower</label>
                    <select id="m_hp"></select>
                </div>
                <div id="div_m_amps" style="display: none;">
                    <label>Motor Nameplate FLA (Amps)</label>
                    <input type="number" id="m_custom_amps" placeholder="e.g. 65.5" min="0" step="0.1">
                </div>
                <div>
                    <label>Distance to Motor (ft)</label>
                    <input type="number" id="m_dist" placeholder="0" min="0" oninput="toggleGray(this)">
                </div>
                <div>
                    <label>Operating Load Amps (Optional for VD)</label>
                    <input type="number" id="m_load_amps" placeholder="Leave blank to hide VD" min="0" oninput="toggleGray(this)">
                </div>
            </div>
            <div class="button-group">
                <button class="calc-btn" onclick="runMotorCalc()">Calculate Motor Circuit</button>
                <button class="reset-btn" onclick="resetDefaults('motor')">Reset Defaults</button>
            </div>
            <div id="m_results" class="results"></div>
        </div>

        <!-- Transformer Circuit Tab -->
        <div id="xfmr" class="tab-content">
            <div class="form-grid">
                <div style="grid-column: span 2;">
                    <label>Transformer kVA</label>
                    <select id="x_kva" style="max-width: 100%;">
                        <option value="15">15 kVA</option>
                        <option value="30">30 kVA</option>
                        <option value="45" selected>45 kVA</option>
                        <option value="75">75 kVA</option>
                        <option value="112.5">112.5 kVA</option>
                        <option value="150">150 kVA</option>
                        <option value="225">225 kVA</option>
                        <option value="300">300 kVA</option>
                        <option value="500">500 kVA</option>
                        <option value="750">750 kVA</option>
                        <option value="1000">1000 kVA</option>
                    </select>
                </div>
                
                <div class="xfmr-pri" style="border-right: 1px solid #ddd; padding-right: 15px;">
                    <h3 style="color:#B0925A; margin-top:0;">Primary Side</h3>
                    <label>Voltage</label>
                    <select id="x_pri_volt" onchange="autoFillWires('x_pri')">
                        <option value="208">208V</option>
                        <option value="240">240V</option>
                        <option value="480" selected>480V</option>
                        <option value="600">600V</option>
                    </select>
                    <label style="margin-top:10px;">Phases</label>
                    <select id="x_pri_phase">
                        <option value="1">1-Phase</option>
                        <option value="3" selected>3-Phase</option>
                    </select>
                    <label style="margin-top:10px;">Total Wires (inc. GND)</label>
                    <input type="number" id="x_pri_wires" value="4" min="2">
                    <label style="margin-top:10px;">Current-Carrying Conductors</label>
                    <input type="number" id="x_pri_ccc" value="3" min="0">
                    <label style="margin-top:10px;">Distance (ft)</label>
                    <input type="number" id="x_pri_dist" placeholder="0" min="0" oninput="toggleGray(this)">
                </div>
                
                <div class="xfmr-sec" style="padding-left: 15px;">
                    <h3 style="color:#B0925A; margin-top:0;">Secondary Side</h3>
                    <label>Voltage</label>
                    <select id="x_sec_volt" onchange="autoFillWires('x_sec')">
                        <option value="120">120V</option>
                        <option value="208" selected>208V (208Y/120V)</option>
                        <option value="240">240V</option>
                        <option value="480">480V</option>
                    </select>
                    <label style="margin-top:10px;">Phases</label>
                    <select id="x_sec_phase">
                        <option value="1">1-Phase</option>
                        <option value="3" selected>3-Phase</option>
                    </select>
                    <label style="margin-top:10px;">Total Wires (inc. GND)</label>
                    <input type="number" id="x_sec_wires" value="5" min="2">
                    <label style="margin-top:10px;">Current-Carrying Conductors</label>
                    <input type="number" id="x_sec_ccc" value="4" min="0">
                    <label style="margin-top:10px;">Distance (ft)</label>
                    <input type="number" id="x_sec_dist" placeholder="0" min="0" oninput="toggleGray(this)">
                </div>
            </div>
            <div class="button-group">
                <button class="calc-btn" onclick="runTransformerCalc()">Calculate Transformer Protection</button>
                <button class="reset-btn" onclick="resetDefaults('xfmr')">Reset Defaults</button>
            </div>
            <div id="x_results" class="results"></div>
        </div>

        <!-- Cable Tray Tab -->
        <div id="tray" class="tab-content">
            <div class="form-grid">
                <div style="grid-column: span 2;">
                    <label>Tray Width (NEC 392.22(B))</label>
                    <select id="t_width" style="max-width: 100%;">
                        <option value="6">6 Inches</option>
                        <option value="12" selected>12 Inches</option>
                        <option value="18">18 Inches</option>
                        <option value="24">24 Inches</option>
                        <option value="30">30 Inches</option>
                        <option value="36">36 Inches</option>
                    </select>
                </div>
                
                <div style="grid-column: span 2;">
                    <label>Conductor Inventory</label>
                    <div id="tray-rows-container" style="display:flex; flex-direction:column; gap:10px; margin-bottom: 10px;">
                        <div class="tray-row">
                            <input type="number" id="t_qty_1" placeholder="Qty" min="0">
                            <span style="font-weight:bold;">x</span>
                            <select id="t_size_1" onchange="toggleCustomTray(1)">
                                <option value="1/0">1/0 AWG</option><option value="2/0">2/0 AWG</option><option value="3/0">3/0 AWG</option><option value="4/0">4/0 AWG</option><option value="250">250 kcmil</option><option value="350">350 kcmil</option><option value="500" selected>500 kcmil</option><option value="custom_small">Custom OD (1/0 - 4/0 size)</option><option value="custom_large">Custom OD (250kcmil+ size)</option>
                            </select>
                            <input type="number" id="t_custom_od_1" placeholder="OD (in)" step="0.01" min="0" style="display:none;">
                        </div>
                        <div class="tray-row">
                            <input type="number" id="t_qty_2" placeholder="Qty" min="0">
                            <span style="font-weight:bold;">x</span>
                            <select id="t_size_2" onchange="toggleCustomTray(2)">
                                <option value="1/0">1/0 AWG</option><option value="2/0">2/0 AWG</option><option value="3/0">3/0 AWG</option><option value="4/0" selected>4/0 AWG</option><option value="250">250 kcmil</option><option value="350">350 kcmil</option><option value="500">500 kcmil</option><option value="custom_small">Custom OD (1/0 - 4/0 size)</option><option value="custom_large">Custom OD (250kcmil+ size)</option>
                            </select>
                            <input type="number" id="t_custom_od_2" placeholder="OD (in)" step="0.01" min="0" style="display:none;">
                        </div>
                        <div class="tray-row">
                            <input type="number" id="t_qty_3" placeholder="Qty" min="0">
                            <span style="font-weight:bold;">x</span>
                            <select id="t_size_3" onchange="toggleCustomTray(3)">
                                <option value="1/0" selected>1/0 AWG</option><option value="2/0">2/0 AWG</option><option value="3/0">3/0 AWG</option><option value="4/0">4/0 AWG</option><option value="250">250 kcmil</option><option value="350">350 kcmil</option><option value="500">500 kcmil</option><option value="custom_small">Custom OD (1/0 - 4/0 size)</option><option value="custom_large">Custom OD (250kcmil+ size)</option>
                            </select>
                            <input type="number" id="t_custom_od_3" placeholder="OD (in)" step="0.01" min="0" style="display:none;">
                        </div>
                    </div>
                    <button type="button" style="background:none; border:1px dashed #ccc; padding:12px; width:100%; cursor:pointer; color:#666; font-weight:bold; border-radius:4px; transition: background-color 0.2s;" onclick="addTrayRow()" onmouseover="this.style.background='#f9f9f9'" onmouseout="this.style.background='none'">+ Add Additional Conductor Size</button>
                </div>
            </div>
            <div class="button-group">
                <button class="calc-btn" onclick="runTrayCalc()">Calculate Tray Fill</button>
                <button class="reset-btn" onclick="resetDefaults('tray')">Reset Defaults</button>
            </div>
            <div id="t_results" class="results"></div>
        </div>

        <!-- Conduit Fill Tab -->
        <div id="conduit" class="tab-content">
            <div class="form-grid">
                <div>
                    <label>Conduit Type</label>
                    <select id="cf_type" onchange="cfTypeChange()">
                        <option value="rmc">Galvanized Rigid Metal Conduit (RMC)</option>
                        <option value="alum">Aluminum Rigid Metal Conduit</option>
                        <option value="pvc40" selected>Schedule 40 PVC</option>
                        <option value="pvc80">Schedule 80 PVC</option>
                        <option value="lfmc">Liquidtight Flexible Metal Conduit (LFMC)</option>
                        <option value="emt">Electrical Metallic Tubing (EMT)</option>
                    </select>
                </div>
                <div>
                    <label>Conduit Trade Size</label>
                    <select id="cf_size" onchange="cfCalc()"></select>
                </div>
                <div style="grid-column: span 2;">
                    <label>Conductor Insulation Type</label>
                    <div class="radio-group">
                        <label><input type="radio" name="cf_ins" value="XHHW2" checked onchange="cfCalc()"> XHHW-2</label>
                        <label><input type="radio" name="cf_ins" value="THHN" onchange="cfCalc()"> THHN / THWN-2</label>
                    </div>
                </div>
                <div style="grid-column: span 2;">
                    <label>Conductors in Conduit (include grounds and neutrals)</label>
                    <div id="cf-rows-container" style="display:flex; flex-direction:column; gap:10px; margin-bottom: 10px;"></div>
                    <button type="button" class="cf-add-btn" onclick="cfAddRow()">+ Add Another Wire Size</button>
                </div>
            </div>
            <div class="button-group">
                <button class="reset-btn" onclick="resetDefaults('conduit')">Reset Defaults</button>
            </div>
            <div id="cf_results" class="results" style="display:block;"></div>
        </div>
    </div>
</div>

<script>
    const STANDARD_BREAKERS = [15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100, 110, 125, 150, 175, 200, 225, 250, 300, 350, 400, 450, 500, 600, 700, 800, 1000, 1200, 1600];
    
    const WIRE_ORDER = ["12", "10", "8", "6", "4", "3", "2", "1", "1/0", "2/0", "3/0", "4/0", "250", "350", "500"];
    const WIRE_DATA = {

    const EGC_DATA = [[20,"12"], [60,"10"], [100,"8"], [200,"6"], [300,"4"], [400,"3"], [500,"2"], [600,"1"], [800,"1/0"], [1000,"2/0"], [1200,"3/0"], [1600,"4/0"]];

    function getDeratingFactor(ccc) {
        if (ccc <= 3) return 1.0;
        if (ccc <= 6) return 0.80;
        if (ccc <= 9) return 0.70;
        if (ccc <= 20) return 0.50;
        if (ccc <= 30) return 0.45;
        if (ccc <= 40) return 0.40;
        return 0.35;
    }

    function applySmallConductor(size, ampacity) {
        const limits = {"12": 20, "10": 30};
        return (limits[size] && ampacity > limits[size]) ? limits[size] : ampacity;
    }

    function isValidForBreaker(wireAmp, brkAmps) {
        if (wireAmp >= brkAmps) return true; 
        if (brkAmps > 800) return false;     
        if (STANDARD_BREAKERS.includes(wireAmp)) return false; 
        let nextStandard = STANDARD_BREAKERS.find(b => b > wireAmp);
        if (nextStandard >= brkAmps) return true;
        return false;
    }

    function getEGCSize(amps) {
        for (let i = 0; i < EGC_DATA.length; i++) {
            if (amps <= EGC_DATA[i][0]) return EGC_DATA[i][1];
        }
        return "250";
    }

    function sizeConduit(phaseWire, tWires, egcWire) {
        let areaReq = (WIRE_DATA[phaseWire][2] * (tWires - 1)) + WIRE_DATA[egcWire][2]; 
        
        let fillLimit = 0.40;
        if (tWires === 1) fillLimit = 0.53;
        else if (tWires === 2) fillLimit = 0.31;

        for (let i = 0; i < CONDUIT_ORDER.length; i++) {
            let size = CONDUIT_ORDER[i];
            let area40 = Math.min(CONDUIT_DATA_RMC[size], CONDUIT_DATA_PVC[size]);
            let area100 = area40 / 0.40;
            let maxAllowableArea = area100 * fillLimit;
            
            if (maxAllowableArea >= areaReq) {
                let fillPct = (areaReq / area100) * 100;
                return { size: size, fill: fillPct.toFixed(1) };
            }
        }
        return { size: "Custom/Tray required", fill: "N/A" };
    }

    function calcVD(wire, amps, dist, volts, phases, sets) {
        if (dist == 0) return 0.0;
        let cmil = WIRE_DATA[wire][3] * sets;
        let vDrop = phases === 3 ? (1.732 * 12.9 * amps * dist) / cmil : (2 * 12.9 * amps * dist) / cmil;
        return (vDrop / volts) * 100;
    }

    function getWireIndex(reqAmps, brkAmps, ccc, allowNextUp, sets, isMotor = false) {
        let derate = getDeratingFactor(ccc);
        for (let i = 0; i < WIRE_ORDER.length; i++) {
            let size = WIRE_ORDER[i];
            let usable = Math.min(WIRE_DATA[size][0], WIRE_DATA[size][1] * derate);
            usable = applySmallConductor(size, usable);
            let totalAmpacity = usable * sets;
            
            if (isMotor) {
                if (totalAmpacity >= reqAmps) return i;
            } else if (allowNextUp) {
                if (isValidForBreaker(totalAmpacity, brkAmps)) return i;
            } else {
                if (totalAmpacity >= brkAmps && totalAmpacity >= reqAmps) return i;
            }
        }
        return WIRE_ORDER.length - 1;
    }

    function formatStrandWire(size) {
        if (["250", "350", "500"].includes(size)) return size + "MCM";
        return "#" + size;
    }

    function formatStrandOutput(sets, selWire, egc, conduitData, phaseCount, neutralCount) {
        let formattedPhase = formatStrandWire(selWire);
        let formattedEGC = formatStrandWire(egc);
        let strandPhase = sets > 1 ? `${sets}~${formattedPhase}/PH` : `${phaseCount}~${formattedPhase}`;
        let strandNeut = "";
        if (neutralCount > 0) {
            let totalNeut = neutralCount * sets;
            strandNeut = totalNeut > 1 ? `${totalNeut}~${formattedPhase} NEUT` : `${formattedPhase} NEUT`;
        }
        let strandGnd = sets > 1 ? `${sets}~${formattedEGC} GND` : `${formattedEGC} GND`;
        let strandCond = sets > 1 ? `${sets}~${conduitData.size}"C.` : `${conduitData.size}" C.`;
        return { phase: strandPhase, neutral: strandNeut, ground: strandGnd, conduit: strandCond };
    }

    function getNEMAStarterSize(hp, fla, volts, phase) {
        let size = "1"; 
        const NEMA_AMPS = [
            { s: "1", a: 27 }, { s: "2", a: 45 }, { s: "3", a: 90 },
            { s: "4", a: 135 }, { s: "5", a: 270 }, { s: "6", a: 540 },
            { s: "7", a: 810 }, { s: "8", a: 1215 }, { s: "9", a: 2250 }
        ];

        if (hp > 0) {
            if (phase === 3) {
                if (volts === 480) {
                    if (hp <= 10) size = "1";
                    else if (hp <= 25) size = "2";
                    else if (hp <= 50) size = "3";
                    else if (hp <= 100) size = "4";
                    else if (hp <= 200) size = "5";
                    else if (hp <= 400) size = "6";
                    else if (hp <= 600) size = "7";
                    else if (hp <= 900) size = "8";
                    else size = "9";
                } else if (volts === 208 || volts === 240) {
                    if (hp <= 7.5) size = "1";
                    else if (hp <= 15) size = "2";
                    else if (hp <= 30) size = "3";
                    else if (hp <= 50) size = "4";
                    else if (hp <= 100) size = "5";
                    else if (hp <= 200) size = "6";
                    else if (hp <= 300) size = "7";
                    else if (hp <= 450) size = "8";
                    else size = "9";
                }
            } else { 
                if (volts === 120) {
                    if (hp <= 2) size = "1";
                    else if (hp <= 3) size = "2";
                    else if (hp <= 7.5) size = "3";
                    else size = "4";
                } else if (volts === 240) {
                    if (hp <= 3) size = "1";
                    else if (hp <= 7.5) size = "2";
                    else if (hp <= 15) size = "3";
                    else size = "4";
                }
            }
        } else {
            for (let i = 0; i < NEMA_AMPS.length; i++) {
                if (fla <= NEMA_AMPS[i].a) {
                    size = NEMA_AMPS[i].s;
                    break;
                }
            }
        }
        return size;
    }

    function generateCoreCircuitData(reqAmps, brkAmps, tWires, ccc, dist, volts, phases, loadAmps, circuitType, fla = 0, nemaSize = null) {
        let sets = reqAmps > 380 ? Math.ceil(reqAmps / 380) : 1;
        
        let allowNextUp = (circuitType === 'feeder' || circuitType === 'xfmr_pri');
        let isMotor = (circuitType === 'motor');
        
        let baseIdx = getWireIndex(reqAmps, brkAmps, 3, allowNextUp, sets, isMotor);
        let deratedIdx = getWireIndex(reqAmps, brkAmps, ccc, allowNextUp, sets, isMotor);
        
        let baseWire = WIRE_ORDER[baseIdx];
        let deratedWire = WIRE_ORDER[deratedIdx];
        let selIdx = deratedIdx;
        let selWire = WIRE_ORDER[selIdx];
        
        let vd = "N/A";
        let vdUpsized = false;
        let vdStartWire = selWire;
        let vDropVolts = 0;

        if (loadAmps > 0 && dist > 0) {
            vd = calcVD(selWire, loadAmps, dist, volts, phases, sets);
            while (vd > 3.0 && selIdx < WIRE_ORDER.length - 1) {
                selIdx++;
                selWire = WIRE_ORDER[selIdx];
                vd = calcVD(selWire, loadAmps, dist, volts, phases, sets);
                vdUpsized = true;
            }
            let totalCmil = WIRE_DATA[selWire][3] * sets;
            vDropVolts = phases === 3 ? (1.732 * 12.9 * loadAmps * dist) / totalCmil : (2 * 12.9 * loadAmps * dist) / totalCmil;
            vd = vd.toFixed(2) + "%";
        }

        let necMaxBreaker = null;
        if (circuitType === 'motor') {
            let brkMaxCalc = fla * 2.5;
            necMaxBreaker = STANDARD_BREAKERS.find(b => b >= brkMaxCalc);
            if (!necMaxBreaker) necMaxBreaker = "Adjustable Trip";
            brkAmps = necMaxBreaker !== "Adjustable Trip" ? necMaxBreaker : brkMaxCalc;
        }

        let baseEgc = getEGCSize(brkAmps);
        let egc = baseEgc;
        let egcMathStr = "";

        if (deratedIdx > baseIdx || vdUpsized) {
            let basePhaseWire = WIRE_ORDER[baseIdx];
            let baseCmil = WIRE_DATA[basePhaseWire][3];
            let finalCmil = WIRE_DATA[selWire][3];
            let ratio = finalCmil / baseCmil;
            let reqEGCCmil = WIRE_DATA[baseEgc][3] * ratio;
            
            let found = false;
            for (let i = 0; i < WIRE_ORDER.length; i++) {
                if (WIRE_DATA[WIRE_ORDER[i]][3] >= reqEGCCmil) {
                    egc = WIRE_ORDER[i];
                    found = true;
                    break;
                }
            }
            if (!found) egc = "500";
            
            egcMathStr += `<br><strong>EGC Proportionate Upsizing (NEC 250.122(B)):</strong><br>`;
            egcMathStr += `Phase wires increased from ${formatStrandWire(basePhaseWire)} (${baseCmil} CMIL) to ${formatStrandWire(selWire)} (${finalCmil} CMIL).<br>`;
            egcMathStr += `CMIL Ratio: ${finalCmil} / ${baseCmil} = ${ratio.toFixed(3)}<br>`;
            egcMathStr += `Required EGC CMIL: Base ${formatStrandWire(baseEgc)} (${WIRE_DATA[baseEgc][3]} CMIL) × ${ratio.toFixed(3)} = ${Math.round(reqEGCCmil)} CMIL<br>`;
            egcMathStr += `Upsized EGC Requirement: <strong>${formatStrandWire(egc)}</strong><br>`;
        }

        let conduitData = sizeConduit(selWire, tWires, egc);
        let phaseCount = phases === 3 ? 3 : (volts === 120 ? 1 : 2);
        let groundCount = 1;
        let neutralCount = tWires - phaseCount - groundCount;
        if (neutralCount < 0) neutralCount = 0; 

        let mathStr = "";
        let derateFactor = getDeratingFactor(ccc);
        let reqAmpsPerSet = (circuitType !== 'motor') ? (reqAmps / sets) : ((fla * 1.25) / sets);

        if (circuitType !== 'motor') {
            mathStr += `<strong>Ampacity & Derating (NEC 310.15 - XHHW-2):</strong><br>`;
            if (circuitType === 'xfmr_sec') {
                 mathStr += `<em style="color:#d9534f">*NEC 240.21(C) prohibits the "Next Size Up" rule for transformer secondary conductors. Wire ampacity must be strictly ≥ OCPD rating (${brkAmps}A).</em><br><br>`;
            }
        } else {
            mathStr += `<strong>Motor Conductor Sizing (NEC 430.22):</strong><br>`;
            mathStr += `Motor FLA: ${fla.toFixed(1)}A<br>`;
            mathStr += `Required Ampacity (125% of FLA): ${(fla * 1.25).toFixed(1)}A<br><br>`;
        }

        if (deratedIdx > baseIdx) {
            let b90 = WIRE_DATA[baseWire][1];
            let bAdj = b90 * derateFactor;
            mathStr += `<em>Initial check ignoring derating:</em><br>`;
            mathStr += `Base wire: <strong>${formatStrandWire(baseWire)}</strong> (90°C Ampacity: ${b90}A).<br>`;
            mathStr += `Adjustment Factor (${ccc} CCC): ${Math.round(derateFactor * 100)}%<br>`;
            mathStr += `Derated: ${b90}A × ${derateFactor} = ${bAdj.toFixed(1)}A <span style="color:#d9534f">(Fails to meet ${reqAmpsPerSet.toFixed(1)}A)</span>.<br><br>`;
            
            let d90 = WIRE_DATA[deratedWire][1];
            let dAdj = d90 * derateFactor;
            mathStr += `<em>Corrected for derating:</em><br>`;
            mathStr += `Upsized to: <strong>${formatStrandWire(deratedWire)}</strong> (90°C Ampacity: ${d90}A).<br>`;
            mathStr += `Adjusted Ampacity: ${d90}A × ${derateFactor} = ${dAdj.toFixed(1)}A (Passes).<br>`;
        } else {
            if (circuitType !== 'motor') {
                let amp75 = WIRE_DATA[selWire][0];
                let amp90 = WIRE_DATA[selWire][1];
                if (ccc > 3) {
                    mathStr += `Base 90°C Ampacity (XHHW-2) for ${formatStrandWire(selWire)}: ${amp90}A<br>`;
                    mathStr += `Adjustment Factor (${ccc} CCC): ${Math.round(derateFactor * 100)}%<br>`;
                    mathStr += `Adjusted Wire Ampacity: ${amp90}A × ${derateFactor} = ${(amp90 * derateFactor).toFixed(1)}A<br>`;
                } else {
                    mathStr += `Base 75°C Terminal Ampacity for ${formatStrandWire(selWire)}: ${amp75}A<br>`;
                    mathStr += `Adjustment Factor (≤3 CCC): 100% (No derating required)<br>`;
                }
            } else {
                let amp75 = WIRE_DATA[selWire][0];
                mathStr += `Selected ${formatStrandWire(selWire)} has a 75°C terminal rating of ${amp75}A (which is ≥ ${(fla * 1.25).toFixed(1)}A).<br>`;
            }
        }

        if (circuitType === 'motor') {
            mathStr += `<br><strong>Circuit Breaker Sizing (NEC 430.52):</strong><br>`;
            mathStr += `NEC Max Allowable Breaker (250% of FLA): ${fla.toFixed(1)}A × 2.5 = ${(fla * 2.5).toFixed(1)}A → <strong>${necMaxBreaker}A</strong><br>`;
            
            mathStr += `<br><strong>Equipment Grounding Conductor (NEC 250.122):</strong><br>`;
            mathStr += `The ground wire is sized based on the actual selected overcurrent protection device rating.<br>`;
            mathStr += `A selected ${brkAmps}A breaker requires a base <strong>${formatStrandWire(baseEgc)}</strong> copper ground.<br>`;
        }

        if (egcMathStr !== "") {
            mathStr += (circuitType === 'motor' ? "" : "<br>") + egcMathStr;
        }

        if (loadAmps > 0 && dist > 0) {
            let multiplier = phases === 3 ? 1.732 : 2;
            mathStr += `<br><strong>Voltage Drop Formula:</strong><br>`;
            mathStr += `(${multiplier} × K × I × D) / CMIL<br>`;
            
            if (vdUpsized) {
                let startCmil = WIRE_DATA[vdStartWire][3] * sets;
                let failVdVolts = phases === 3 ? (1.732 * 12.9 * loadAmps * dist) / startCmil : (2 * 12.9 * loadAmps * dist) / startCmil;
                let failVdPct = (failVdVolts / volts) * 100;
                mathStr += `<br><em>Initial check with ${formatStrandWire(vdStartWire)} (${startCmil} CMIL):</em><br>`;
                mathStr += `(${multiplier} × 12.9 × ${loadAmps}A × ${dist}ft) / ${startCmil} = ${failVdVolts.toFixed(2)} Volts<br>`;
                mathStr += `(${failVdVolts.toFixed(2)}V / ${volts}V) × 100 = <strong style="color:#d9534f">${failVdPct.toFixed(2)}% (Fails > 3%)</strong><br>`;
                
                let passCmil = WIRE_DATA[selWire][3] * sets;
                mathStr += `<br><em>Corrected check with ${formatStrandWire(selWire)} (${passCmil} CMIL):</em><br>`;
                mathStr += `(${multiplier} × 12.9 × ${loadAmps}A × ${dist}ft) / ${passCmil} = ${vDropVolts.toFixed(2)} Volts<br>`;
                mathStr += `(${vDropVolts.toFixed(2)}V / ${volts}V) × 100 = <strong>${vd}</strong><br>`;
            } else {
                let passCmil = WIRE_DATA[selWire][3] * sets;
                mathStr += `(${multiplier} × 12.9 × ${loadAmps}A × ${dist}ft) / ${passCmil} CMIL = ${vDropVolts.toFixed(2)} Volts<br>`;
                mathStr += `(${vDropVolts.toFixed(2)}V / ${volts}V) × 100 = <strong>${vd}</strong>`;
            }
        }

        let strandFormat = formatStrandOutput(sets, selWire, egc, conduitData, phaseCount, neutralCount);

        let alerts = [];
        if (deratedIdx > baseIdx) {
            alerts.push(`DERATING UPSIZE:\nPhase wire increased from #${WIRE_ORDER[baseIdx]} to #${WIRE_ORDER[deratedIdx]} due to derating rules.\nGround wire proportionally upsized per 250.122(B).`);
        }
        if (vdUpsized) {
            alerts.push(`VOLTAGE DROP UPSIZE:\nPhase wire further increased from #${vdStartWire} to #${selWire} to correct >3% voltage drop.\nGround wire proportionally upsized per 250.122(B).`);
        }

        let wireResults = {
            "Phase Wire Size": `${selWire} AWG/kcmil`,
            "Ground Wire (EGC)": `${egc} AWG/kcmil`,
            "Conductors (Per Conduit)": `${phaseCount} Phase, ${neutralCount} Neutral, ${groundCount} Ground`
        };

        if (circuitType === 'motor') {
            wireResults["Max Allowable Breaker (250%)"] = `${necMaxBreaker}A`;
            if (nemaSize) {
                wireResults["Min. NEMA Starter"] = `Size ${nemaSize}`;
            }
        }

        if (loadAmps > 0 && dist > 0) {
            wireResults["Calculated Voltage Drop"] = vd;
        }

        let conduitResults = {
            "Conduit Size (Min. PVC/RMC)": `${conduitData.size}"`,
            "Conduit Fill (%)": conduitData.fill !== "N/A" ? `${conduitData.fill}%` : "N/A",
            "Conduits Required": sets
        };

        return { 
            wire: wireResults, 
            conduit: conduitResults, 
            strand: strandFormat, 
            math: mathStr,
            hasUpsize: (deratedIdx > baseIdx || vdUpsized),
            alerts: alerts 
        };
    }

    function runMotorCalc() {
        let type = document.querySelector('input[name="m_input_type"]:checked').value;
        let volt = parseFloat(document.getElementById('m_volt').value);
        let dist = parseFloat(document.getElementById('m_dist').value) || 0;
        let loadAmps = parseFloat(document.getElementById('m_load_amps').value) || 0;
        
        let phase = (volt === 120 || volt === 240) ? 1 : 3; 
        let wires = (volt === 120) ? 3 : 4; 
        let ccc = (volt === 120 || volt === 240) ? 2 : 3;
        
        let titleStr = "";
        let fla = 0;
        let hpVal = 0;

        html += `Primary Protection (125% Next Size Up): ${pFLA.toFixed(1)}A × 1.25 = ${pBrkCalc.toFixed(1)}A → <strong>${pBrk}A</strong><br>`;

    function runTrayCalc() {
        let width = parseFloat(document.getElementById('t_width').value);
        let maxArea = TRAY_LIMITS[width.toString()];
        
        let totalArea = 0;
        let totalOd = 0;
        let breakdown = "";
        let has1_0to4_0 = false;
        let has250Plus = false;

        for(let i=1; i<=trayRowCount; i++) {
            let qtyEl = document.getElementById(`t_qty_${i}`);
            if (qtyEl && qtyEl.value) {
                let qty = parseInt(qtyEl.value);
                if (qty > 0) {
                    let size = document.getElementById(`t_size_${i}`).value;
                    let od = 0, area = 0, label = size;

                    if (size === 'custom_small' || size === 'custom_large') {
                        od = parseFloat(document.getElementById(`t_custom_od_${i}`).value) || 0;
                        if (od <= 0) {
                            alert("Please enter a valid Custom OD.");
                            return;
                        }
                        area = Math.PI * Math.pow((od / 2), 2);
                        if (size === 'custom_small') has1_0to4_0 = true;
                        if (size === 'custom_large') has250Plus = true;
                        label = `Custom (${od}" OD)`;
                    } else {
                        let data = TRAY_WIRE_DATA[size];
                        od = data.od;
                        area = data.area;
                        if (["1/0", "2/0", "3/0", "4/0"].includes(size)) has1_0to4_0 = true;
                        else has250Plus = true;
                    }

                    totalOd += (od * qty);
                    totalArea += (area * qty);
                    
                    if (["1/0", "2/0", "3/0", "4/0", "custom_small"].includes(size)) {
                        breakdown += `• ${qty}x ${label} (OD: ${od}") = ${(od * qty).toFixed(2)}" diam.<br>`;
                    } else {
                        breakdown += `• ${qty}x ${label} (Area: ${area.toFixed(4)} sq in, OD: ${od}")<br>`;
                    }
                }
            }
        }

        if (totalArea === 0 && totalOd === 0) {
            alert("Please enter at least one conductor quantity.");
            return;
        }

        let passed = false;
        let mathStr = "";

        if (has1_0to4_0) {
            passed = totalOd <= width;
            mathStr = `Evaluating mixed or small-conductor run (NEC 392.22(B)(1)(d)):<br>Because 1/0 - 4/0 AWG conductors are present, all single conductors must be installed in a single layer without exceeding tray width.<br>Sum of All Diameters: ${totalOd.toFixed(2)} inches.<br>Max Tray Width: ${width} inches.`;
        } else if (has250Plus) {
            passed = totalArea <= maxArea;
            mathStr = `Evaluating 250kcmil+ conductor run (NEC 392.22(B)(1)(b)):<br>Sum of Cross-Sectional Areas: ${totalArea.toFixed(2)} sq in.<br>Max Allowable Fill (Column 1): ${maxArea.toFixed(2)} sq in.`;
        }

        let statusColor = passed ? "green" : "#d9534f";
        let statusText = passed ? "PASS" : "FAIL - EXCEEDS CAPACITY";

        let html = `<div class="results-header">Tray Fill Results: ${width}" Tray</div>`;
        html += `<div style="padding:15px; border:2px solid ${statusColor}; background:#fff; border-radius:4px; margin-bottom:15px;">`;
        html += `<h3 style="color:${statusColor}; margin-top:0;">${statusText}</h3>`;
        html += `<p>${mathStr}</p>`;
        html += `</div>`;
        
        html += `<details class="math-box">`;
        html += `<summary>Inventory Breakdown (Click to expand)</summary>`;
        html += `<div class="math-box-content">${breakdown}</div>`;
        html += `</details>`;
        
        let div = document.getElementById('t_results');
        div.innerHTML = html;
        div.style.display = 'block';
    }

            <span class="cf-x">x</span>
            <select class="cf-size" onchange="cfSizeChange(this)">${cfSizeOptions(size)}</select>
            <input type="number" class="cf-od" placeholder="Overall dia. (in)" step="0.001" min="0" style="display:none;" oninput="cfCalc()">
            <button type="button" class="cf-remove" onclick="cfRemoveRow(this)" aria-label="Remove this wire size">&#10005;</button>
        `;
        document.getElementById('cf-rows-container').appendChild(div);
        cfCalc();
    }

    function cfStep(btn, delta) {
        let input = btn.parentElement.querySelector('.cf-qty');
        let v = parseInt(input.value) || 0;
        input.value = Math.max(0, v + delta);
        cfCalc();
    }

    function cfSizeChange(sel) {
        let od = sel.parentElement.querySelector('.cf-od');
        od.style.display = sel.value === 'custom' ? 'block' : 'none';
        if (sel.value === 'custom') od.focus();
        cfCalc();
    }

    function cfRemoveRow(btn) {
        let container = document.getElementById('cf-rows-container');
        if (container.children.length <= 1) {
            // keep at least one row - just clear its quantity
            let r = container.querySelector('.cf-row');
            r.querySelector('.cf-qty').value = 0;
            r.querySelector('.cf-size').value = "";
            r.querySelector('.cf-od').style.display = 'none';
            r.querySelector('.cf-od').value = "";
        } else {
            btn.parentElement.remove();
        }
        cfCalc();
    }

    function cfPopulateSizes(preferred) {
        let type = document.getElementById('cf_type').value;
        let areas = CF_CONDUIT[type].areas;
        let sel = document.getElementById('cf_size');
        let sizes = CF_SIZE_ORDER.filter(s => areas[s] !== undefined);
        sel.innerHTML = sizes.map(s => `<option value="${s}">${s} in.</option>`).join("");
        sel.value = sizes.includes(preferred) ? preferred : (sizes.includes("2") ? "2" : sizes[0]);
    }

    function cfTypeChange() {
        cfPopulateSizes(document.getElementById('cf_size').value);
        cfCalc();
    }

    function cfReset() {
        document.getElementById('cf_type').value = "pvc40";
        document.querySelector('input[name="cf_ins"][value="XHHW2"]').checked = true;
        cfPopulateSizes("2");
        document.getElementById('cf-rows-container').innerHTML = "";
        cfAddRow();
        cfCalc();
    }

    function cfCalc() {
        let typeKey = document.getElementById('cf_type').value;
        let conduit = CF_CONDUIT[typeKey];
        let tradeSize = document.getElementById('cf_size').value;
        let conduitArea = conduit.areas[tradeSize];
        let ins = document.querySelector('input[name="cf_ins"]:checked').value;

        let totalCount = 0, totalArea = 0, breakdown = "", pendingCustom = false, pendingSize = false;

        document.querySelectorAll('#cf-rows-container .cf-row').forEach(row => {
            let qty = parseInt(row.querySelector('.cf-qty').value) || 0;
            if (qty <= 0) return;
            let size = row.querySelector('.cf-size').value;
            if (size === "") { pendingSize = true; return; }
            let area, label;
            if (size === 'custom') {
                let od = parseFloat(row.querySelector('.cf-od').value) || 0;
                if (od <= 0) { pendingCustom = true; return; }
                area = Math.PI * od * od / 4;
                label = `Custom (${od}" OD)`;
            } else {
                area = CF_WIRE_AREA[ins][size];
                label = `${cfWireLabel(size)} ${CF_INS_LABEL[ins]}`;
            }
            totalCount += qty;
            totalArea += qty * area;
            breakdown += `&bull; ${qty} x ${label}: ${area.toFixed(4)} sq in each = <strong>${(qty * area).toFixed(4)} sq in</strong><br>`;
        });

        let out = document.getElementById('cf_results');
        out.style.display = 'block';

        if (totalCount === 0) {
            out.innerHTML = `<div class="results-header">Conduit Fill Results</div><p style="margin:0; font-size:14px;">${pendingSize ? "Select a wire size for each row that has a quantity." : pendingCustom ? "Enter the overall diameter for your custom wire." : "0 conductors in conduit. Enter a quantity and select a wire size to calculate fill."}</p>`;
            return;
        }

        // NEC Chapter 9, Table 1 fill limits
        let limitPct, limitWhy;
        if (totalCount === 1) { limitPct = 53; limitWhy = "1 conductor"; }
        else if (totalCount === 2) { limitPct = 31; limitWhy = "2 conductors"; }
        else { limitPct = 40; limitWhy = `${totalCount} conductors`; }

        let fillPct = totalArea / conduitArea * 100;
        let allowedArea = conduitArea * limitPct / 100;
        let passed = fillPct <= limitPct + 1e-9;
        let cls = passed ? "" : "fail";

        // Smallest compliant trade size for this conduit type
        let minSize = null;
        for (const s of CF_SIZE_ORDER) {
            let a = conduit.areas[s];
            if (a !== undefined && totalArea <= a * limitPct / 100 + 1e-9) { minSize = s; break; }
        }

        let msg;
        if (passed) {
            msg = `Meets NEC Chapter 9, Table 1 (${limitPct}% maximum for ${limitWhy}).`;
            if (minSize && minSize !== tradeSize) msg += ` Smallest compliant ${conduit.name} size: <strong>${minSize} in.</strong>`;
        } else {
            msg = `Does NOT meet the NEC. Fill exceeds the ${limitPct}% maximum allowed for ${limitWhy} (NEC Chapter 9, Table 1). `;
            msg += minSize
                ? `Increase to at least <strong>${minSize} in.</strong> ${conduit.name}, or reduce the number/size of conductors.`
                : `No standard size of ${conduit.name} is large enough. Split the conductors into multiple conduits or use a different conduit type.`;
        }

        let barWidth = Math.min(fillPct, 100);
        let html = `<div class="results-header">Conduit Fill Results</div>`;
        html += `<div class="cf-result-box ${cls}">`;
        html += `<div class="cf-pct-label">Total Conduit Fill</div>`;
        html += `<div class="cf-pct ${cls}">${fillPct.toFixed(1)}%</div>`;
        html += `<p class="cf-status ${cls}">${passed ? "PASS - MEETS NEC" : "FAIL - EXCEEDS NEC MAXIMUM FILL"}</p>`;
        html += `<div class="cf-bar"><div class="cf-bar-fill ${cls}" style="width:${barWidth}%"></div><div class="cf-bar-limit" style="left:${limitPct}%" title="NEC limit ${limitPct}%"></div></div>`;
        html += `<div class="cf-bar-legend">Black marker = NEC maximum (${limitPct}%)</div>`;
        html += `<p class="cf-msg">${msg}</p>`;
        html += `</div>`;

        html += `<div class="results-grid">`;
        html += `<div class="results-column"><h3>Conduit</h3>`;
        html += `<p>Type: <strong>${conduit.name}</strong></p>`;
        html += `<p>Trade Size: <strong>${tradeSize} in.</strong></p>`;
        html += `<p>Internal Area (100%): <strong>${conduitArea.toFixed(3)} sq in</strong></p>`;
        html += `<p>Max Allowed Area (${limitPct}%): <strong>${allowedArea.toFixed(3)} sq in</strong></p>`;
        html += `</div>`;
        html += `<div class="results-column"><h3>Conductors</h3>`;
        html += `<p>Total Conductors: <strong>${totalCount}</strong></p>`;
        html += `<p>Total Conductor Area: <strong>${totalArea.toFixed(4)} sq in</strong></p>`;
        html += `<p>${passed ? "Remaining Capacity" : "Over Limit By"}: <strong>${Math.abs(allowedArea - totalArea).toFixed(4)} sq in</strong></p>`;
        html += `<p>Insulation: <strong>${CF_INS_LABEL[ins]}</strong></p>`;
        html += `</div></div>`;

        if (pendingCustom || pendingSize) {
            html += `<p style="font-size:13px; color:#d9534f; margin:10px 0 0 0;">Note: ${pendingSize ? "a row with a quantity has no wire size selected" : "a custom-diameter row has no diameter entered"} and is not included in this total.</p>`;
        }

        html += `<details class="math-box">`;
        html += `<summary>Calculation Math Breakdown (Click to expand)</summary>`;
        html += `<div class="math-box-content">${breakdown}<br>`;
        html += `Total Conductor Area = ${totalArea.toFixed(4)} sq in<br>`;
        html += `Fill % = ${totalArea.toFixed(4)} / ${conduitArea.toFixed(3)} x 100 = <strong>${fillPct.toFixed(2)}%</strong><br>`;
        html += `NEC limit = ${limitPct}% (${limitWhy})<br><br>`;
        html += `<em>Conductor areas: NEC Chapter 9, Table 5 (${CF_INS_LABEL[ins]}). Conduit areas: NEC Chapter 9, Table 4.`;
        if (typeKey === 'alum') html += ` Aluminum rigid conduit uses the same Table 4 dimensions as galvanized RMC.`;
        html += ` Custom diameters use area = &pi; x d&sup2; / 4. Bare grounding conductors are counted per Table 8 and are not included unless entered above.</em>`;
        html += `</div></details>`;

        out.innerHTML = html;
    }

    cfPopulateSizes("2");
    cfAddRow();
    cfCalc();
</script>
</body>
</html>
